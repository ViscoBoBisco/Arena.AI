name: Disposable Characters DB qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-vault-terminal-characters-db:
    name: Qualify Vault Terminal Characters DB on disposable MySQL
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: arena-foundry-ci-only
          MYSQL_DATABASE: arena_foundry_disposable_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Create protected client option file
        run: |
          cat > /tmp/arena-foundry-mysql.cnf <<'EOF'
          [client]
          host=127.0.0.1
          user=root
          password=arena-foundry-ci-only
          EOF
          chmod 600 /tmp/arena-foundry-mysql.cnf
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='SELECT VERSION(), DATABASE();' arena_foundry_disposable_ci

      - name: Assert unsupported World content fails closed
        run: |
          python3 tools/foundry.py verify packages/frost-armory
          python3 - <<'PY'
          from pathlib import Path
          from foundry.spec import load_spec, validate_spec
          result = validate_spec(load_spec(Path('specs/frost-armory.json')), allow_unverified=True)
          assert result.verdicts['emitter-coverage'] == 'FAIL'
          print('World DB qualification is intentionally blocked; no database was contacted.')
          PY

      - name: Build generated Vault Terminal package
        run: python3 tools/foundry.py build specs/vault-terminal.json --out /tmp/vault-terminal

      - name: Create isolated disposable Characters database
        run: |
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='CREATE DATABASE arena_foundry_disposable_characters_ci CHARACTER SET utf8mb4;'

      - name: Qualify the generated Characters ledger migration and read query
        run: |
          if ! python3 tools/foundry_characters_qualify.py /tmp/vault-terminal \
            --database arena_foundry_disposable_characters_ci \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/vault-terminal-characters-db-proof.json \
            > /tmp/vault-terminal-characters-db.log 2>&1; then
            cat /tmp/vault-terminal-characters-db.log
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/vault-terminal-characters-db.log').read_text(errors='replace').strip().splitlines()
          detail = lines[-1] if lines else 'qualification command failed without diagnostics'
          detail = detail.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          print(f'::error title=Vault Terminal Characters DB qualification failed::{detail}')
          PY
            exit 1
          fi
          cat /tmp/vault-terminal-characters-db.log

      - name: Validate Characters proof scope and publish run summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path('/tmp/vault-terminal-characters-db-proof.json').read_text())
          assert proof['schema'] == 'arena-characters-db-qualification/3'
          assert proof['qualification'] == 'ARENA-DB-CHARACTERS'
          assert proof['status'] == 'PASS'
          assert proof['trust'] == 'SYNTHETIC_DISPOSABLE_MYSQL'
          assert proof['table'] == 'vault_terminal_claims'
          assert proof['table_schema']['engine'] == 'InnoDB'
          assert proof['table_schema']['primary_key'] == 'guid'
          assert proof['checks']['migration_applied_twice'] == 'PASS'
          assert proof['checks']['legacy_daily_claims_migrated_and_retained'] == 'PASS'
          assert proof['checks']['same_request_concurrent_retry_replayed'] == 'PASS'
          assert proof['checks']['lost_response_retry_replayed'] == 'PASS'
          assert proof['checks']['concurrent_distinct_requests_attributed'] == 'PASS'
          assert proof['checks']['concurrent_target_cap_enforced'] == 'PASS'
          assert proof['checks']['transaction_failure_rolled_back'] == 'PASS'
          assert proof['checks']['retry_after_transaction_failure'] == 'PASS'
          assert proof['checks']['module_state_query'] == 'PASS'
          assert proof['environment']['source_commit'] == os.environ['GITHUB_SHA']
          print('ARENA-DB-CHARACTERS PASS: isolated synthetic schema/table checks only.')
          print('This proof does not qualify an AzerothCore runtime, client, or gameplay.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Vault Terminal Characters ledger', file=summary)
              print('', file=summary)
              print('- Table-scoped synthetic MySQL check: **PASS**', file=summary)
              print(f"- Table: `{proof['table']}`", file=summary)
              print(f"- MySQL: `{proof['server_version']}`", file=summary)
              print(f"- Package manifest SHA-256: `{proof['manifest_sha256']}`", file=summary)
              print('- No AzerothCore runtime or gameplay qualification is implied.', file=summary)
          PY

      - name: Record table-scoped Characters maturity outcome
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/vault-terminal-qualification-report.json').read_text())
          assert report.get('qualified') is False
          assert report.get('status') == 'BLOCKED'
          print(json.dumps({
              'overall_status': report.get('status'),
              'evidence_trust': report.get('artifact_maturity', {}).get('trust'),
              'database_gates': {item['name']: item['status'] for item in report.get('gates', [])
                                 if item['name'].startswith('database_migrations')},
          }, sort_keys=True))
          print('Characters DB proof remains table-scoped; overall release is blocked.')
          PY
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('- Vault Terminal Characters DB qualification: **PASS (table-scoped)**', file=summary)
              print('- Overall package release: **BLOCKED**; no runtime/client/live claim is implied.', file=summary)
          PY

      - name: Preserve Vault Terminal Characters qualification records
        uses: actions/upload-artifact@v4
        with:
          name: arena-characters-db-qualification-${{ github.run_id }}
          path: |
            /tmp/vault-terminal/
            /tmp/vault-terminal-characters-db-proof.json
            /tmp/vault-terminal-characters-db.log
            /tmp/vault-terminal-qualification-report.json
            /tmp/vault-terminal-qualification.log
          if-no-files-found: error
          retention-days: 30
