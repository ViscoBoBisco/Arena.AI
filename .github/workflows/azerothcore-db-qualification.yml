name: Disposable Characters DB qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-vault-terminal-characters-db:
    name: Qualify Vault Terminal Characters DB on disposable MySQL
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: arena-foundry-ci-only
          MYSQL_DATABASE: arena_foundry_disposable_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Install disposable DB test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          python3 -m pip install --disable-pip-version-check -r requirements-world-qualification.txt

      - name: Exercise World-row ownership on synthetic InnoDB tables
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
        run: |
          set +e
          python3 -m unittest tests.test_foundry_world_ownership -v \
            > /tmp/arena-world-ownership-test.log 2>&1
          test_status=$?
          set -e
          cat /tmp/arena-world-ownership-test.log
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/arena-world-ownership-test.log').read_text(errors='replace').strip().splitlines()
          detail = '\\n'.join(lines[-24:]) if lines else 'World ownership MySQL integration failed without diagnostics'
          detail = detail.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          print(f'::error title=World ownership disposable MySQL integration::{detail}')
          PY
            exit "$test_status"
          fi

      - name: Fetch the exact pinned AzerothCore World schema source
        run: |
          git init /tmp/acore-pinned
          git -C /tmp/acore-pinned remote add origin https://github.com/azerothcore/azerothcore-wotlk.git
          git -C /tmp/acore-pinned fetch --depth=1 --filter=blob:none origin 6ffb62abb867dabb258de6813ff5d06d6b011543
          git -C /tmp/acore-pinned sparse-checkout init --cone
          git -C /tmp/acore-pinned sparse-checkout set \
            data/sql/base/db_world \
            src/server/game/Spells \
            src/server/game/Entities/Player \
            src/server/scripts/Spells
          git -C /tmp/acore-pinned checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acore-pinned rev-parse HEAD)" = 6ffb62abb867dabb258de6813ff5d06d6b011543

      - name: Verify new gameplay IDs against the exact pinned AzerothCore source
        run: |
          grep -F 'SPELL_MAGE_ARCANE_MISSILES_R1                = 5143' \
            /tmp/acore-pinned/src/server/scripts/Spells/spell_mage.cpp
          grep -F '(774,1058,2)' /tmp/acore-pinned/data/sql/base/db_world/spell_ranks.sql
          grep -F '(774,48441,15)' /tmp/acore-pinned/data/sql/base/db_world/spell_ranks.sql
          grep -F 'ApplySpellFix({ 5143, 5144, 5145, 8416, 8417, 10211, 10212, 25345, 27075, 38699, 38704, 42843, 42846 }' \
            /tmp/acore-pinned/src/server/game/Spells/SpellInfoCorrections.cpp
          python3 - <<'PY'
          from pathlib import Path
          aura_cpp = Path('/tmp/acore-pinned/src/server/game/Spells/Auras/SpellAuraEffects.cpp').read_text()
          start = aura_cpp.index('case 57819: // Argent Champion')
          end = aura_cpp.index('// LK Intro VO', start)
          champion_handler = aura_cpp[start:end]
          assert 'case 57819:' in champion_handler and 'FactionID = 1106;' in champion_handler
          assert 'SetChampioningFaction(FactionID)' in champion_handler
          spell_cpp = Path('/tmp/acore-pinned/src/server/game/Spells/Spell.cpp').read_text()
          hook = spell_cpp.index('sScriptMgr->OnPlayerSpellCast(playerCaster, this, skipCheck);')
          assert spell_cpp.index('TakePower();', hook) > hook, 'cast hook must precede paid resource deduction'
          assert 'cast(true);' in spell_cpp, 'pinned core uses skipCheck=true on validated cast paths'
          player_cpp = Path('/tmp/acore-pinned/src/server/game/Entities/Player/PlayerUpdates.cpp').read_text()
          unit_update = player_cpp.index('Unit::Update(p_time);')
          script_update = player_cpp.index('sScriptMgr->OnPlayerUpdate(this, p_time);', unit_update)
          assert script_update > unit_update, 'refund observer must run after Unit spell processing'
          world = Path('/tmp/acore-pinned/data/sql/base/db_world')
          item_line = next(line for line in (world / 'item_template.sql').read_text().splitlines()
                           if line.startswith('(22739,'))
          assert "(22739,9,0,-1,'Tome of Polymorph: Turtle'" in item_line
          assert ',28271,6,' in item_line, 'inscription must retain its native item-use spell'
          loot_line = next(line for line in (world / 'creature_loot_template.sql').read_text().splitlines()
                           if line.startswith('(15114,22739,'))
          assert ',0,15,0,1,0,1,1,' in loot_line and 'Tome of Polymorph: Turtle' in loot_line
          item_lines = (world / 'item_template.sql').read_text().splitlines()
          shadow_bolt = next(line for line in item_lines if line.startswith('(21281,'))
          assert "'Grimoire of Shadow Bolt X'" in shadow_bolt and ',25307,6,' in shadow_bolt
          shadow_ward = next(line for line in item_lines if line.startswith('(22891,'))
          assert "'Grimoire of Shadow Ward IV'" in shadow_ward and ',28610,6,' in shadow_ward
          ranks = (world / 'spell_ranks.sql').read_text()
          assert '(686,25307,10)' in ranks and '(6229,28610,4)' in ranks
          reference_loot = (world / 'reference_loot_template.sql').read_text()
          assert '(34024,21281,' in reference_loot and '(30171,22891,' in reference_loot
          creature_loot = (world / 'creature_loot_template.sql').read_text()
          assert '(15339,34024,34024,' in creature_loot
          assert '(11502,30171,30171,' in creature_loot and '(11583,30171,30171,' in creature_loot
          medic = next(line for line in (world / 'creature_template.sql').read_text().splitlines()
                       if line.startswith('(16284,'))
          assert "'Argent Medic'" in medic
          medic_ai = [line for line in (world / 'smart_scripts.sql').read_text().splitlines()
                      if line.startswith('(16284,') and '28133' in line]
          assert medic_ai, 'stock Argent Medic must already use native Cure Disease 28133'
          print('Pinned collectible items, acquisition tables, spell ranks and Argent Medic service verified.')
          print('Cast hook precedes power deduction; player update follows Unit spell processing.')
          PY

      - name: Initialize exact pinned World DDL and exercise process-crash recovery
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_pinned_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
          ARENA_PINNED_CORE_SOURCE: /tmp/acore-pinned
          ARENA_WORLD_SCHEMA_PROOF: /tmp/arena-world-schema-proof.json
          ARENA_WORLD_FIXTURE_PACKAGE: /tmp/arena-world-seven-table-package
          ARENA_WORLD_QUALIFICATION_ATTESTATIONS: /tmp/arena-world-qualification-attestations.json
        run: |
          set -o pipefail
          cat > /tmp/arena-foundry-mysql.cnf <<'EOF'
          [client]
          host=127.0.0.1
          user=root
          password=arena-foundry-ci-only
          EOF
          chmod 600 /tmp/arena-foundry-mysql.cnf
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='CREATE DATABASE arena_foundry_disposable_pinned_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          set +e
          python3 -m unittest tests.test_foundry_world_schema -v \
            > /tmp/arena-world-schema-test.log 2>&1
          schema_test_status=$?
          set -e
          cat /tmp/arena-world-schema-test.log
          if [ "$schema_test_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/arena-world-schema-test.log').read_text(errors='replace').strip().splitlines()
          detail = '\\n'.join(lines[-45:]) if lines else 'pinned World schema integration failed without diagnostics'
          detail = detail.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          print(f'::error title=Pinned World schema integration::{detail}')
          PY
            exit "$schema_test_status"
          fi
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/arena-world-schema-proof.json').read_text())
          proof_hash = proof.pop('evidence_sha256')
          canonical = json.dumps(proof, sort_keys=True, separators=(',', ':'), default=str).encode()
          assert hashlib.sha256(canonical).hexdigest() == proof_hash
          proof['evidence_sha256'] = proof_hash
          schema_keys = ('schema', 'database', 'trust', 'source', 'created_tables',
                         'runtime_tables', 'base_data_imported')
          schema_body = {key: proof[key] for key in schema_keys}
          schema_hash = hashlib.sha256(json.dumps(
              schema_body, sort_keys=True, separators=(',', ':'), default=str).encode()).hexdigest()
          assert schema_hash == proof['runtime_schema_sha256']
          assert proof['schema'] == 'arena-world-schema-source/1'
          assert proof['trust'] == 'SYNTHETIC_DISPOSABLE_MYSQL_PINNED_SCHEMA'
          assert proof['source']['revision'] == '6ffb62abb867dabb258de6813ff5d06d6b011543'
          assert len(proof['created_tables']) == 7
          assert proof['base_data_imported'] is False
          assert all(table['engine'] == 'innodb' for table in proof['runtime_tables'].values())
          assert proof['process_recovery']['status'] == 'PASS'
          assert proof['process_recovery']['child_exit_code'] == 73
          assert proof['world_row_checks']['status'] == 'PASS'
          assert set(proof['world_row_checks']['tables']) == set(proof['created_tables'])
          assert all(table_checks == {'apply': 'PASS', 'rollback': 'PASS'}
                     for table_checks in proof['world_row_checks']['tables'].values())
          assert proof['process_recovery']['uncommitted_rows_and_journal_state_changes_absent'] == 'PASS'
          assert proof['process_recovery']['same_request_receipt_replayed'] == 'PASS'
          print('Pinned DDL source hashes, runtime World-table keys, and process recovery verified.')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Pinned World schema ownership/restart evidence', file=summary)
              print('', file=summary)
              print('- Exact upstream commit: `6ffb62abb867dabb258de6813ff5d06d6b011543`', file=summary)
              print('- Seven source-derived table DDLs and runtime InnoDB primary keys: **PASS**', file=summary)
              print('- Abrupt child-process death mid-transaction, restart retry, receipt replay, rollback: **PASS**', file=summary)
              print('- Evidence is synthetic disposable MySQL schema only; no base data, server boot, gameplay, or live qualification.', file=summary)
          PY

      - name: Create source-bound ARENA-DB attestation and reconnect the qualification gate
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_pinned_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
        run: |
          python3 tools/foundry_world_qualify.py /tmp/arena-world-seven-table-package \
            --database arena_foundry_disposable_pinned_ci \
            --core-source /tmp/acore-pinned \
            --schema-proof /tmp/arena-world-schema-proof.json \
            --recovery-proof /tmp/arena-world-schema-proof.json \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/arena-world-cli-attestations.json
          set +e
          python3 tools/foundry.py qualify /tmp/arena-world-seven-table-package \
            --attestations /tmp/arena-world-cli-attestations.json \
            --out /tmp/arena-world-qualification-report.json \
            > /tmp/arena-world-qualification.log 2>&1
          qualify_status=$?
          set -e
          if [ "$qualify_status" -ne 1 ]; then
            cat /tmp/arena-world-qualification.log
            echo "Expected the world DB gate to pass while runtime/release gates remain blocked."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/arena-world-qualification-report.json').read_text())
          assert report['status'] == 'BLOCKED'
          assert report['qualified'] is False
          gates = {item['name']: item['status'] for item in report['gates']}
          assert gates['database_migrations:world'] == 'PASS'
          assert gates['database_migrations'] == 'PASS'
          print('ARENA-DB world migration gate PASS for this exact synthetic package; release remains BLOCKED.')
          PY

      - name: Preserve pinned World schema and process recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: arena-world-schema-recovery-${{ github.run_id }}
          path: |
            /tmp/arena-world-schema-proof.json
            /tmp/arena-world-schema-test.log
            /tmp/arena-world-seven-table-package/
            /tmp/arena-world-qualification-attestations.json
            /tmp/arena-world-cli-attestations.json
            /tmp/arena-world-qualification-report.json
            /tmp/arena-world-qualification.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify Portable Hole commodity reservations on disposable MySQL
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_portable_hole_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
        run: |
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='CREATE DATABASE arena_foundry_disposable_portable_hole_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          set +e
          python3 -m unittest tests.test_portable_hole_mysql -v \
            > /tmp/portable-hole-mysql-test.log 2>&1
          portable_hole_test_status=$?
          set -e
          cat /tmp/portable-hole-mysql-test.log
          if [ "$portable_hole_test_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/portable-hole-mysql-test.log').read_text(errors='replace').strip().splitlines()
          detail = '\\n'.join(lines[-45:]) if lines else 'Portable Hole MySQL integration failed without diagnostics'
          detail = detail.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          print(f'::error title=Portable Hole disposable MySQL::{detail}')
          PY
            exit "$portable_hole_test_status"
          fi
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Portable Hole commodity ledger', file=summary)
              print('', file=summary)
              print('- MySQL 8.4 InnoDB receipts, private GUID scope, reservations, competing requests and abrupt-process rollback: **PASS**', file=summary)
              print('- Credits in this slice are GM/server-authorized virtual commodity grants; physical item transfer and Party sharing are not implemented.', file=summary)
          PY

      - name: Qualify Runic Codex persistence on disposable MySQL
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_portable_hole_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
        run: |
          if ! python3 -m unittest tests.test_runic_codex_mysql -v > /tmp/runic-codex-mysql-test.log 2>&1; then
            cat /tmp/runic-codex-mysql-test.log
            exit 1
          fi
          cat /tmp/runic-codex-mysql-test.log

      - name: Qualify Argent Commission persistence on disposable MySQL
        env:
          ARENA_MYSQL_HOST: 127.0.0.1
          ARENA_MYSQL_PORT: 3306
          ARENA_MYSQL_DATABASE: arena_foundry_disposable_portable_hole_ci
          ARENA_MYSQL_USER: root
          ARENA_MYSQL_PASSWORD: arena-foundry-ci-only
        run: |
          if ! python3 -m unittest tests.test_argent_commission_mysql -v > /tmp/argent-commission-mysql-test.log 2>&1; then
            cat /tmp/argent-commission-mysql-test.log
            exit 1
          fi
          cat /tmp/argent-commission-mysql-test.log

      - name: Assert unsupported World content fails closed
        run: |
          python3 tools/foundry.py verify packages/frost-armory
          python3 - <<'PY'
          from pathlib import Path
          from foundry.spec import load_spec, validate_spec
          result = validate_spec(load_spec(Path('specs/frost-armory.json')), allow_unverified=True)
          assert result.verdicts['emitter-coverage'] == 'FAIL'
          print('Unsupported Frost Armory content remains fail-closed; its declarations were not sent to the disposable DB.')
          PY

      - name: Build generated Vault Terminal package
        run: python3 tools/foundry.py build specs/vault-terminal.json --out /tmp/vault-terminal

      - name: Create isolated disposable Characters database
        run: |
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='CREATE DATABASE arena_foundry_disposable_characters_ci CHARACTER SET utf8mb4;'

      - name: Qualify the generated Characters ledger migration and read query
        run: |
          if ! python3 tools/foundry_characters_qualify.py /tmp/vault-terminal \
            --database arena_foundry_disposable_characters_ci \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/vault-terminal-characters-db-proof.json \
            > /tmp/vault-terminal-characters-db.log 2>&1; then
            cat /tmp/vault-terminal-characters-db.log
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/vault-terminal-characters-db.log').read_text(errors='replace').strip().splitlines()
          detail = lines[-1] if lines else 'qualification command failed without diagnostics'
          detail = detail.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          print(f'::error title=Vault Terminal Characters DB qualification failed::{detail}')
          PY
            exit 1
          fi
          cat /tmp/vault-terminal-characters-db.log

      - name: Validate Characters proof scope and publish run summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path('/tmp/vault-terminal-characters-db-proof.json').read_text())
          assert proof['schema'] == 'arena-characters-db-qualification/3'
          assert proof['qualification'] == 'ARENA-DB-CHARACTERS'
          assert proof['status'] == 'PASS'
          assert proof['trust'] == 'SYNTHETIC_DISPOSABLE_MYSQL'
          assert proof['table'] == 'vault_terminal_claims'
          assert proof['table_schema']['engine'] == 'InnoDB'
          assert proof['table_schema']['primary_key'] == 'guid'
          assert proof['checks']['migration_applied_twice'] == 'PASS'
          assert proof['checks']['legacy_daily_claims_migrated_and_retained'] == 'PASS'
          assert proof['checks']['same_request_concurrent_retry_replayed'] == 'PASS'
          assert proof['checks']['lost_response_retry_replayed'] == 'PASS'
          assert proof['checks']['concurrent_distinct_requests_attributed'] == 'PASS'
          assert proof['checks']['concurrent_target_cap_enforced'] == 'PASS'
          assert proof['checks']['transaction_failure_rolled_back'] == 'PASS'
          assert proof['checks']['retry_after_transaction_failure'] == 'PASS'
          assert proof['checks']['module_state_query'] == 'PASS'
          assert proof['environment']['source_commit'] == os.environ['GITHUB_SHA']
          print('ARENA-DB-CHARACTERS PASS: isolated synthetic schema/table checks only.')
          print('This proof does not qualify an AzerothCore runtime, client, or gameplay.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Vault Terminal Characters ledger', file=summary)
              print('', file=summary)
              print('- Table-scoped synthetic MySQL check: **PASS**', file=summary)
              print(f"- Table: `{proof['table']}`", file=summary)
              print(f"- MySQL: `{proof['server_version']}`", file=summary)
              print(f"- Package manifest SHA-256: `{proof['manifest_sha256']}`", file=summary)
              print('- No AzerothCore runtime or gameplay qualification is implied.', file=summary)
          PY

      - name: Record table-scoped Characters maturity outcome
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/vault-terminal-characters-db-proof.json').read_text())
          attestations = {
              'schema': 'arena-qualification-attestations/1',
              'subject': {'manifest_sha256': proof['manifest_sha256']},
              'characters_database_qualifications': [proof],
          }
          Path('/tmp/vault-terminal-attestations.json').write_text(
              json.dumps(attestations, indent=2, sort_keys=True) + chr(10))
          PY
          set +e
          python3 tools/foundry.py qualify /tmp/vault-terminal \
            --attestations /tmp/vault-terminal-attestations.json \
            --out /tmp/vault-terminal-qualification-report.json \
            > /tmp/vault-terminal-qualification.log 2>&1
          qualify_status=$?
          set -e
          if [ "$qualify_status" -ne 1 ]; then
            cat /tmp/vault-terminal-qualification.log
            echo "Expected qualification to remain blocked by runtime/client gates."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/vault-terminal-qualification-report.json').read_text())
          assert report.get('qualified') is False
          assert report.get('status') == 'BLOCKED'
          print(json.dumps({
              'overall_status': report.get('status'),
              'evidence_trust': report.get('artifact_maturity', {}).get('trust'),
              'database_gates': {item['name']: item['status'] for item in report.get('gates', [])
                                 if item['name'].startswith('database_migrations')},
          }, sort_keys=True))
          print('Characters DB proof remains table-scoped; overall release is blocked.')
          PY
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('- Vault Terminal Characters DB qualification: **PASS (table-scoped)**', file=summary)
              print('- Overall package release: **BLOCKED**; no runtime/client/live claim is implied.', file=summary)
          PY

      - name: Preserve Vault Terminal Characters qualification records
        uses: actions/upload-artifact@v4
        with:
          name: arena-characters-db-qualification-${{ github.run_id }}
          path: |
            /tmp/vault-terminal/
            /tmp/vault-terminal-characters-db-proof.json
            /tmp/vault-terminal-characters-db.log
            /tmp/vault-terminal-qualification-report.json
            /tmp/vault-terminal-qualification.log
          if-no-files-found: error
          retention-days: 30

      - name: Record four-module database qualification evidence
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          reports = {}
          for name, filename in (
              ('portable_hole', '/tmp/portable-hole-mysql-test.log'),
              ('runic_codex', '/tmp/runic-codex-mysql-test.log'),
              ('argent_commission', '/tmp/argent-commission-mysql-test.log'),
          ):
              text = Path(filename).read_text(errors='replace')
              match = re.search(r'Ran (\d+) tests? in ([0-9.]+)s', text)
              assert match and ('OK' in text), f'{name} did not produce a passing unittest report'
              reports[name] = {'status': 'PASS', 'tests': int(match.group(1)),
                               'duration_seconds': float(match.group(2)),
                               'project_shared_reservations': 'PASS' if name == 'portable_hole' else 'N/A'}
          evidence = {
              'schema': 'arena-disposable-module-db-evidence/1',
              'source': {'repository': os.environ['GITHUB_REPOSITORY'],
                         'head': os.environ['SOURCE_HEAD']},
              'mysql_server': 'mysql:8.4.3 disposable service',
              'tests': reports,
              'portable_hole_project_migration': '003_portable_hole_projects.sql applied in lexical order',
              'scope': 'DISPOSABLE MYSQL AND SYNTHETIC CHARACTERS DATA ONLY',
              'worldserver_boot': 'NOT_ASSESSED',
              'private_campaign_party_client': 'NOT_ASSESSED',
          }
          Path('/tmp/module-db-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY

      - name: Preserve module database qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: arena-four-module-database-qualification-${{ github.sha }}
          path: |
            /tmp/module-db-evidence.json
            /tmp/portable-hole-mysql-test.log
            /tmp/runic-codex-mysql-test.log
            /tmp/argent-commission-mysql-test.log
            /tmp/vault-terminal-characters-db-proof.json
            /tmp/vault-terminal-characters-db.log
            /tmp/vault-terminal-qualification-report.json
            /tmp/vault-terminal-qualification.log
          if-no-files-found: error
          retention-days: 30
