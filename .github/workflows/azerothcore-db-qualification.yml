name: pinned AzerothCore disposable DB qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-generated-world-sql:
    name: Qualify Foundry world SQL on pinned AzerothCore schema
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: arena-foundry-ci-only
          MYSQL_DATABASE: arena_foundry_disposable_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Checkout exact AzerothCore schema source pin
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("foundry/core-pins.json"))["azerothcore_wotlk"]["revision"])')"
          git clone https://github.com/azerothcore/azerothcore-wotlk.git /tmp/azerothcore
          git -C /tmp/azerothcore checkout --detach "$revision"
          test "$(git -C /tmp/azerothcore rev-parse HEAD)" = "$revision"

      - name: Create protected client option file
        run: |
          cat > /tmp/arena-foundry-mysql.cnf <<'EOF'
          [client]
          host=127.0.0.1
          user=root
          password=arena-foundry-ci-only
          EOF
          chmod 600 /tmp/arena-foundry-mysql.cnf
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='SELECT VERSION(), DATABASE();' arena_foundry_disposable_ci

      - name: Initialize touched tables from pinned world base SQL
        run: |
          set -euo pipefail
          for table in \
            creature_template creature_template_model game_event item_template \
            npc_vendor quest_template spell_dbc; do
            source="/tmp/azerothcore/data/sql/base/db_world/${table}.sql"
            test -s "$source"
            mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
              --database=arena_foundry_disposable_ci < "$source"
          done

      - name: Build package preview
        run: |
          python3 tools/foundry.py build specs/frost-armory.json \
            --out /tmp/frost-armory --allow-unverified

      - name: Execute database apply/idempotence/rollback checks
        run: |
          if ! python3 tools/foundry_db_qualify.py /tmp/frost-armory \
            --database arena_foundry_disposable_ci \
            --core-source /tmp/azerothcore \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/arena-db-attestations.json > /tmp/arena-db-run.log 2>&1; then
            cat /tmp/arena-db-run.log
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/arena-db-run.log').read_text(errors='replace').strip().splitlines()
          detail = lines[-1] if lines else 'qualification command failed'
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=ARENA-DB qualification failed::{detail}')
          PY
            exit 1
          fi
          cat /tmp/arena-db-run.log

      - name: Validate proof context and publish run summary
        run: |
          set +e
          python3 tools/foundry.py qualify /tmp/frost-armory \
            --attestations /tmp/arena-db-attestations.json \
            --out /tmp/arena-qualification-report.json > /tmp/arena-qualify.log 2>&1
          qualify_status=$?
          set -e
          if [ "$qualify_status" -ne 1 ]; then
            cat /tmp/arena-qualify.log
            echo "Expected overall qualification to remain blocked outside the DB gate."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/arena-db-attestations.json').read_text())
          report = json.loads(Path('/tmp/arena-qualification-report.json').read_text())
          db = proof['database_qualification']
          pin = json.loads(Path('foundry/core-pins.json').read_text())['azerothcore_wotlk']
          gates = {gate['name']: gate['status'] for gate in report['gates']}
          assert proof['levels']['ARENA-DB']['status'] == 'PASS'
          assert db['schema'] == 'arena-db-qualification/2'
          assert db['schema_source']['revision'] == pin['revision']
          assert db['checked_rows'] > 0
          assert db['checked_values'] >= db['checked_rows']
          assert len(db['semantic_sha256']) == 64
          assert gates.get('database_migrations') == 'PASS'
          assert report['qualified'] is False
          print(f"ARENA-DB PASS: {db['checked_rows']} identities; MySQL {db['server_version']}")
          print(f"Pinned schema revision: {db['schema_source']['revision']}")
          print('Overall package remains BLOCKED by other unassessed gates, as expected.')
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## ARENA-DB qualification', file=summary)
              print('', file=summary)
              print('- ARENA-DB policy gate: **PASS**', file=summary)
              print('- Overall package qualification: **BLOCKED** (expected; unrelated gates remain unassessed)', file=summary)
              print(f"- Pinned AzerothCore schema: `{db['schema_source']['revision']}`", file=summary)
              print(f"- MySQL: `{db['server_version']}`", file=summary)
              print(f"- Checked row identities: `{db['checked_rows']}`", file=summary)
              print(f"- Manifest SHA-256: `{db['manifest_sha256']}`", file=summary)
          PY

      - name: Build generated Vault Terminal package
        run: python3 tools/foundry.py build specs/vault-terminal.json --out /tmp/vault-terminal

      - name: Create isolated disposable Characters database
        run: |
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='CREATE DATABASE arena_foundry_disposable_characters_ci CHARACTER SET utf8mb4;'

      - name: Qualify the generated Characters ledger migration and read query
        run: |
          python3 tools/foundry_characters_qualify.py /tmp/vault-terminal \
            --database arena_foundry_disposable_characters_ci \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/vault-terminal-characters-db-proof.json

      - name: Validate Characters proof scope and publish run summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path('/tmp/vault-terminal-characters-db-proof.json').read_text())
          assert proof['qualification'] == 'ARENA-DB-CHARACTERS'
          assert proof['status'] == 'PASS'
          assert proof['trust'] == 'SYNTHETIC_DISPOSABLE_MYSQL'
          assert proof['table'] == 'vault_terminal_claims'
          assert proof['checks']['migration_applied_twice'] == 'PASS'
          assert proof['checks']['concurrent_daily_increment_serialized'] == 'PASS'
          assert proof['checks']['concurrent_target_cap_enforced'] == 'PASS'
          assert proof['checks']['module_state_query'] == 'PASS'
          assert proof['environment']['source_commit'] == os.environ['GITHUB_SHA']
          print('ARENA-DB-CHARACTERS PASS: isolated synthetic schema/table checks only.')
          print('This proof does not qualify an AzerothCore runtime, client, or gameplay.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Vault Terminal Characters ledger', file=summary)
              print('', file=summary)
              print('- Table-scoped synthetic MySQL check: **PASS**', file=summary)
              print(f"- Table: `{proof['table']}`", file=summary)
              print(f"- MySQL: `{proof['server_version']}`", file=summary)
              print(f"- Package manifest SHA-256: `{proof['manifest_sha256']}`", file=summary)
              print('- No AzerothCore runtime or gameplay qualification is implied.', file=summary)
          PY

      - name: Preserve package and DB qualification records
        uses: actions/upload-artifact@v4
        with:
          name: arena-db-qualification-${{ github.run_id }}
          path: |
            /tmp/frost-armory/
            /tmp/vault-terminal/
            /tmp/arena-db-attestations.json
            /tmp/arena-qualification-report.json
            /tmp/vault-terminal-characters-db-proof.json
          if-no-files-found: error
          retention-days: 30
