name: pinned AzerothCore disposable DB qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-generated-world-sql:
    name: Qualify Foundry world SQL on pinned AzerothCore schema
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: arena-foundry-ci-only
          MYSQL_DATABASE: arena_foundry_disposable_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Checkout exact AzerothCore schema source pin
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("foundry/core-pins.json"))["azerothcore_wotlk"]["revision"])')"
          git clone https://github.com/azerothcore/azerothcore-wotlk.git /tmp/azerothcore
          git -C /tmp/azerothcore checkout --detach "$revision"
          test "$(git -C /tmp/azerothcore rev-parse HEAD)" = "$revision"

      - name: Create protected client option file
        run: |
          cat > /tmp/arena-foundry-mysql.cnf <<'EOF'
          [client]
          host=127.0.0.1
          user=root
          password=arena-foundry-ci-only
          EOF
          chmod 600 /tmp/arena-foundry-mysql.cnf
          mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
            --execute='SELECT VERSION(), DATABASE();' arena_foundry_disposable_ci

      - name: Initialize touched tables from pinned world base SQL
        run: |
          set -euo pipefail
          for table in \
            creature_template creature_template_model game_event item_template \
            npc_vendor quest_template spell_dbc; do
            source="/tmp/azerothcore/data/sql/base/db_world/${table}.sql"
            test -s "$source"
            mysql --defaults-extra-file=/tmp/arena-foundry-mysql.cnf \
              --database=arena_foundry_disposable_ci < "$source"
          done

      - name: Build package preview
        run: |
          python3 tools/foundry.py build specs/frost-armory.json \
            --out /tmp/frost-armory --allow-unverified

      - name: Execute database apply/idempotence/rollback checks
        run: |
          if ! python3 tools/foundry_db_qualify.py /tmp/frost-armory \
            --database arena_foundry_disposable_ci \
            --core-source /tmp/azerothcore \
            --defaults-extra-file /tmp/arena-foundry-mysql.cnf \
            --confirm-disposable \
            --out /tmp/arena-db-attestations.json > /tmp/arena-db-run.log 2>&1; then
            cat /tmp/arena-db-run.log
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/arena-db-run.log').read_text(errors='replace').strip().splitlines()
          detail = lines[-1] if lines else 'qualification command failed'
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=ARENA-DB qualification failed::{detail}')
          PY
            exit 1
          fi
          cat /tmp/arena-db-run.log

      - name: Validate proof context and publish run summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/arena-db-attestations.json').read_text())
          db = proof['database_qualification']
          pin = json.loads(Path('foundry/core-pins.json').read_text())['azerothcore_wotlk']
          assert proof['levels']['ARENA-DB']['status'] == 'PASS'
          assert db['schema_source']['revision'] == pin['revision']
          assert db['checked_rows'] > 0
          print(f"ARENA-DB PASS: {db['checked_rows']} identities; MySQL {db['server_version']}")
          print(f"Pinned schema revision: {db['schema_source']['revision']}")
          with open(Path('/tmp/arena-db-summary.md'), 'w') as stream:
              stream.write('## ARENA-DB qualification\n\n')
              stream.write('- Status: **PASS**\n')
              stream.write(f"- Pinned AzerothCore schema: `{db['schema_source']['revision']}`\n")
              stream.write(f"- MySQL: `{db['server_version']}`\n")
              stream.write(f"- Checked row identities: `{db['checked_rows']}`\n")
              stream.write(f"- Manifest SHA-256: `{db['manifest_sha256']}`\n")
          PY
          cat /tmp/arena-db-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve package and raw DB proof
        uses: actions/upload-artifact@v4
        with:
          name: arena-db-qualification-${{ github.run_id }}
          path: |
            /tmp/frost-armory/
            /tmp/arena-db-attestations.json
          if-no-files-found: error
          retention-days: 30
