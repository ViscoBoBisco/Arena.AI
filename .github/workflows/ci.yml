name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: python ${{ matrix.python }}
    # ubuntu-latest (24.04) currently fails to provision 3.9 via setup-python; 22.04 has both.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Lua 5.1 test runtime
        run: python3 -m pip install --disable-pip-version-check lupa==2.6

      - name: Tool selftest (synthetic DBC fixtures)
        run: python3 tools/selftest.py

      - name: Test suite (tools + documentation integrity)
        run: python3 -m unittest discover -s tests -v

      - name: Manifest round-trip
        run: |
          mkdir -p /tmp/stage/DBFilesClient
          printf 'ci-fixture' > /tmp/stage/DBFilesClient/Item.dbc
          python3 tools/manifest.py make --staging /tmp/stage --version "ci-${GITHUB_SHA}" --out /tmp/manifest.json
          python3 tools/manifest.py verify --manifest /tmp/manifest.json --staging /tmp/stage

      - name: Preflight on a synthetic consistent pair
        run: |
          python3 - <<'PY'
          import struct, pathlib
          def dbc(path, fields, rows, strings=b"\0"):
              p = pathlib.Path(path); p.parent.mkdir(parents=True, exist_ok=True)
              body = b"".join(struct.pack("<" + "i"*fields, *r) for r in rows)
              p.write_bytes(struct.pack("<4sIIII", b"WDBC", len(rows), fields, fields*4, len(strings)) + body + strings)
          dbc("/tmp/pf/client/ItemDisplayInfo.dbc", 25, [(41179, *([0]*24))])
          dbc("/tmp/pf/client/Item.dbc", 8, [(800000, 2, 7, -1, 1, 41179, 17, 3)])
          pathlib.Path("/tmp/pf/server").mkdir(parents=True, exist_ok=True)
          for name in ("Item.dbc", "ItemDisplayInfo.dbc"):
              pathlib.Path("/tmp/pf/server", name).write_bytes(
                  pathlib.Path("/tmp/pf/client", name).read_bytes())
          PY
          ./tools/preflight.sh /tmp/pf/client /tmp/pf/server
