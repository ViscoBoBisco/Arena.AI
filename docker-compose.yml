# Single-host deployment (manual 5.6): bind the gateway to loopback behind a
# TLS-terminating reverse proxy; state stays on an internal network + named volume.
services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080" # do not expose plaintext API directly to the internet
    environment:
      - UNIFIED_ENV=production
      - CALLBACK_SECRET=${CALLBACK_SECRET:?set CALLBACK_SECRET in .env}
      - UNIFIED_API_KEYS=${UNIFIED_API_KEYS:?set UNIFIED_API_KEYS in .env}
      - UNIFIED_WEB_ALLOWLIST=${UNIFIED_WEB_ALLOWLIST:-[]}
    volumes:
      - arena-data:/data     # ledger, artifacts, memory, graph
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  arena-data:
