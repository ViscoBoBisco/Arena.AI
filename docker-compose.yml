# Single-host deployment (manual 5.6): bind the gateway to loopback behind a
# TLS-terminating reverse proxy; state stays on an internal network + named volume.
services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080" # do not expose plaintext API directly to the internet
    environment:
      - UNIFIED_ENV=production
      - CALLBACK_SECRET_FILE=/run/secrets/callback_secret
      - UNIFIED_API_KEYS_FILE=/run/secrets/api_keys
      - UNIFIED_WEB_ALLOWLIST=${UNIFIED_WEB_ALLOWLIST:-[]}
      # Inference. Production refuses "simulated" per model call; set a real
      # provider in .env. Ollama on the Docker host: use
      # CONFLUX_MODEL_BASE_URL=http://host.docker.internal:11434 (see extra_hosts).
      - CONFLUX_MODEL_PROVIDER=${CONFLUX_MODEL_PROVIDER:-simulated}
      - CONFLUX_MODEL_BASE_URL=${CONFLUX_MODEL_BASE_URL:-}
      - CONFLUX_MODEL_NAME=${CONFLUX_MODEL_NAME:-}
      - CONFLUX_MODEL_BILLABLE=${CONFLUX_MODEL_BILLABLE:-true}
      - CONFLUX_MODEL_INPUT_COST_PER_MILLION=${CONFLUX_MODEL_INPUT_COST_PER_MILLION:-}
      - CONFLUX_MODEL_OUTPUT_COST_PER_MILLION=${CONFLUX_MODEL_OUTPUT_COST_PER_MILLION:-}
      - CONFLUX_MODEL_API_KEY_FILE=/run/secrets/model_api_key
    secrets:
      - callback_secret
      - api_keys
      - model_api_key
    extra_hosts:
      # Lets the container reach an Ollama or other model server on the Docker host.
      - "host.docker.internal:host-gateway"
    volumes:
      - arena-data:/data     # ledger, artifacts, memory, graph
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.50
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  arena-data:

secrets:
  callback_secret:
    file: ${CALLBACK_SECRET_FILE:?set CALLBACK_SECRET_FILE to a protected local file}
  api_keys:
    file: ${UNIFIED_API_KEYS_FILE:?set UNIFIED_API_KEYS_FILE to a protected JSON file}
  # Optional: set CONFLUX_MODEL_API_KEY_FILE for hosted OpenAI-compatible APIs.
  # Without it, an empty secret is mounted and no Authorization header is sent.
  model_api_key:
    file: ${CONFLUX_MODEL_API_KEY_FILE:-/dev/null}
